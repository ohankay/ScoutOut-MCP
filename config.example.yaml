# ScoutOut-Mcp yapılandırması. Yeri: %APPDATA%\ScoutOut-Mcp\config.yaml (scripts\setup.ps1 oluşturur).
# Kurulum betiği sunucu adını, kullanıcı adını ve parolayı terminalde sorar. Parola bu dosyaya yazılmaz:
# password_file (sadece bu Windows kullanıcısının okuyabildiği dosya) veya SCOUTOUT_DB_PASSWORD ortam değişkeni.

connection:
  server: "SUNUCU_ADI,1433"        # canlı kopyaların açıldığı izole SQL Server
  user: "KULLANICI_ADI"            # SQL kullanıcı adı; salt-okur olmalı (yazma yetkisi görülürse bağlantı reddedilir)
  auth: sql                        # veya windows
  password_file: ""                # setup.ps1 doldurur
  encrypt: true
  trust_server_certificate: false

mcp:
  databases: []                    # boş = loginin açabildiği bütün kullanıcı veritabanları
  exclude_databases: []
  masking_database: BoaCatalog
  masking_query: >-
    SELECT DatabaseName, SchemaName, TableName, ColumnName, DataMaskType, TermName
    FROM Dtg.TableColumnDataMaskDetail
  k: 20                            # 20'den az görülen sayım ve biçimler ajana gösterilmez

llm:                               # kurum içi OpenAI uyumlu LLM; sadece mine_rules kullanır. Bulut sağlayıcı yok.
  # Ollama örneği:  endpoint: http://localhost:11434/v1   model: qwen2.5:14b-instruct
  endpoint: https://LLM-GATEWAY/vllm-qwen3-235b-fp8/v1
  model: /data/models--Qwen--Qwen3-235B-FP8
  allowed_hosts: [LLM-GATEWAY]     # endpoint'in sunucu adı burada olmalı (izin listesi)
  temperature: 0
  timeout_s: 120
  # max_tokens: 1024
  extra_body:                      # Qwen3 + vLLM: düşünme modunu kapatır
    chat_template_kwargs: {enable_thinking: false}
  api_key_env: SCOUTOUT_LLM_API_KEY  # sunucu anahtar istiyorsa (veya api_key_file: dosya yolu)
  ca_bundle: ""                    # boş = Windows sertifika deposu (kurumsal CA); gerekirse PEM dosyası
  # Bağlantı her zaman proxy'siz kurulur.

# scan:                            # isteğe bağlı tarama ayarları (ScoutOut ile aynı)
#   concurrency: 4
#   maintenance_window: "22:00-06:00"
