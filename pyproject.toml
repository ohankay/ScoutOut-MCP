[project]
name = "scoutout-mcp"
version = "0.1.0"
description = "ScoutOut as a local MCP server: sensitive data discovery and masking audit for MS SQL Server without exposing values"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyodbc>=5.1",
  "pyyaml>=6.0",
  "numpy>=2.4.6",
  "openpyxl>=3.1.5",
  "scikit-learn>=1.9.1",
  "httpx>=0.28.1",
  "regex>=2026.11.19",
  "tzdata>=2026.6",
  "mcp>=1.20",
]

[project.scripts]
scoutout-mcp = "scoutout_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.1",
  "hypothesis>=6.100",
  "python-stdnum>=1.20",
  "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoutout", "src/scoutout_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "mssql: needs a live SQL Server (dev container)",
  "large: needs the large synthetic database",
  "llm: needs a running local LLM (Ollama)",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/scoutout/synth/dataset.py" = ["E501"]
